[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vtrigger"
version = "0.1.0"
description = "Codebase health scanner. Finds dead code, unused imports, duplicated functions, hardcoded secrets, circular dependencies, and oversized files. 20 languages."
requires-python = ">=3.9"
license = "MIT"  # + Commons Clause (see LICENSE file)
readme = "README.md"
authors = [{name = "heathen"}]
keywords = [
    "linter", "static-analysis", "dead-code", "unused-imports", "code-quality",
    "code-health", "codebase-scanner", "technical-debt", "refactoring",
    "duplication", "secrets-detection", "import-cycles", "cli",
    "ai-agent", "claude-code", "cursor", "copilot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "click",
    "rich",
    "tree-sitter>=0.23.0",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "pyyaml",
]

[project.scripts]
vtrigger = "omega.cli:main"

[project.urls]
Homepage = "https://github.com/LoserLab/vtrigger"
Repository = "https://github.com/LoserLab/vtrigger"
Issues = "https://github.com/LoserLab/vtrigger/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
